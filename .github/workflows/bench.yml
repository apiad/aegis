name: bench

# The release benchmark, on a runner instead of a laptop (#43).
#
# One job measures the previous release from PyPI and then the checked-out
# commit, back to back on the same runner, and compares the two. A runner is a
# shared VM and is not quiet either, but both sides see the same machine in the
# same hour, which a summary saved on zion at the last release never did: zion
# runs the daemon and agent sessions, and at v0.42.0 its load showed up as a
# uniform +15% across every scenario, startup included.
#
# Red means `aegis bench compare` found a regression (exit 1). A scenario that
# failed inside a run (exit 1 from `bench run`) is a warning; a run that could
# not finish at all (exit 2) is red.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Released X.Y.Z to compare against (default: the nearest release tag behind this commit)"
        required: false
      repeat:
        description: "Repeats per scenario"
        required: false
        default: "3"
  pull_request:
    paths:
      - ".github/workflows/bench.yml"
      - "src/aegis/bench/**"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Typer forces a terminal under GITHUB_ACTIONS (#7); keep the log and the
      # step summary free of escape codes, and wide enough for the tables.
      NO_COLOR: "1"
      COLUMNS: "140"
      REPEAT: ${{ inputs.repeat || '3' }}
      BASELINE_INPUT: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - run: uv sync --locked

      - name: resolve baseline
        id: base
        run: |
          base="$BASELINE_INPUT"
          if [ -z "$base" ]; then
            # The nearest release behind this commit's parent: v0.41.0 for a
            # PR or an untagged release commit cut after it, and still
            # v0.41.0 for the v0.42.0 commit once tagged, never itself.
            base="$(git describe --tags --abbrev=0 --match 'v*' HEAD^)"
            base="${base#v}"
          fi
          echo "baseline: $base"
          echo "version=$base" >> "$GITHUB_OUTPUT"

      - name: bench the baseline
        env:
          BASE: ${{ steps.base.outputs.version }}
        run: |
          set +e
          uv run aegis bench run --target "$BASE" --repeat "$REPEAT" --out "$RUNNER_TEMP/bench"
          rc=$?
          [ "$rc" -eq 1 ] && echo "::warning::a baseline scenario failed; see the log"
          [ "$rc" -le 1 ]

      - name: bench this commit
        run: |
          set +e
          uv run aegis bench run --repeat "$REPEAT" --out "$RUNNER_TEMP/bench"
          rc=$?
          [ "$rc" -eq 1 ] && echo "::warning::a scenario failed on this commit; see the log"
          [ "$rc" -le 1 ]

      - name: compare
        env:
          BASE: ${{ steps.base.outputs.version }}
        run: |
          base_dir="$(ls -d "$RUNNER_TEMP/bench"/*-"$BASE")"
          cand_dir="$(ls -d "$RUNNER_TEMP/bench"/*-current)"
          set +e
          uv run aegis bench compare "$base_dir" "$cand_dir" > compare.txt 2>&1
          rc=$?
          set -e
          cat compare.txt
          {
            echo "## aegis bench: $BASE → ${GITHUB_SHA::7}"
            echo
            echo '```text'
            cat compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-runs
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore
