name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # A websocket test that waits forever must not hold a runner for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - run: uv sync --locked

      # Each gate is its own step so a red run names which one failed in the
      # job list, without anyone opening the log.
      #
      # `make check` is deliberately not used here: it runs `format`, which
      # rewrites files (a runner has to fail instead), and `lint-docs`, which
      # needs `rift` — private and not on PyPI, so it stays a local gate.
      - name: format
        run: make format-check
      - name: lint
        run: make lint
      # Blocking, unlike typecheck below: a filename parse over a handful of
      # files, no backlog, and a fragment that does not parse is a release note
      # that silently goes missing.
      - name: changelog fragments
        run: make changelog-check
      # aegis2's browser tests drive headless Chromium.
      - name: chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -m "not live"

      # Blocking, as in `make check`: the tree has no diagnostics.
      - name: typecheck
        run: make typecheck

  # aegis2's bench, on the PR's base and head on one runner so the machine
  # cancels out. Reports in the job summary and warns past 20% worse; it
  # never fails the run (scripts/bench2_compare.py exits 0, and every step
  # here may fail without failing the job).
  bench2:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: bench head
        run: uv run python scripts/bench2.py --out /tmp/head.json
      - name: bench base
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          if [ -f /tmp/base/scripts/bench2.py ]; then
            cd /tmp/base && uv sync --locked && uv run python scripts/bench2.py --out /tmp/base.json
          fi
      - name: compare
        if: always()
        run: uv run python scripts/bench2_compare.py /tmp/base.json /tmp/head.json
