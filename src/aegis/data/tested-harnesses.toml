# The harness versions this release of aegis was tested with: the canary
# (scripts/canary.sh) passed at min and at max. know-how/releasing.md says how
# to move them. Read by harness_versions.py and by the canary.
[claude-code]
package = "@anthropic-ai/claude-code"
min = "2.1.296"
max = "2.1.316"

[codex]
package = "@openai/codex"
min = "0.163.0"
max = "0.164.0"

[opencode]
package = "@opencode/cli"
min = "2.0.31"
max = "2.1.2"
hint = "aegis drives OpenCode 2, published as @opencode/cli."

[cursor]
# Not an npm package: the official install is Cursor's own script, and the
# `cursor-agent` name on npm is an unrelated package (measured, 2026-10).
# The canary does not cover it (cursor-agent needs a real Cursor login); the
# session tests run it behind tests/fake_cursor.py, and min was exercised by
# hand against cursor-agent 2026.10.14-0f9edde, which reads as a pre-release
# and so asks once to be accepted (harness_versions.accepted).
package = "cursor-agent"
min = "2026.10.14"
max = "2026.10.14"
hint = "cursor-agent comes from Cursor's installer, not npm."
