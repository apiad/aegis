<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/static/icons/aegis-192.png">
<title>aegis</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/themes/ink.css">
<link rel="stylesheet" href="/static/themes/logbook.css">
<link rel="stylesheet" href="/static/themes/syalia.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("aegis.theme") || "ink";</script>
</head>
<body>
<div id="a2" class="app" data-view="boot">
  <header class="tabs">
    <div class="tab home" id="tab-fleet" title="Fleet (Alt+0)">Fleet</div>
    <div class="tablist" id="tablist"></div>
    <div class="tab add" id="tab-add" title="New session (Alt+N)">+</div>
    <div class="gap"></div>
    <div class="servers"><span class="dot ghost" id="conn-dot"></span><span id="conn-text">connecting</span><span class="ver-top" id="ver-top" hidden></span></div>
    <button class="keys-btn bell" id="bell" title="Turn on desktop notifications"></button>
    <button class="side-btn" id="side-btn" title="Session details" aria-label="Session details">☰</button>
    <button class="keys-btn" id="keys-btn" title="Keyboard (?)">?</button>
    <label class="theme-pick">Theme
      <select id="theme">
        <option value="ink">Ink</option>
        <option value="logbook">Logbook</option>
        <option value="syalia">Syalia</option>
      </select>
    </label>
  </header>

  <main class="view v-boot">
    <div class="boot">
      <div class="notice" id="boot-text">Connecting…</div>
      <form class="login" id="login" hidden>
        <label for="login-token">Paste the token <code>aegis serve</code> printed. This browser stays signed in.</label>
        <input id="login-token" type="password" autocomplete="current-password" spellcheck="false" required>
        <button class="btn primary" type="submit">Sign in</button>
        <p class="err-text" id="login-error"></p>
      </form>
    </div>
  </main>

  <main class="view v-fleet">
    <section class="band" id="band">
      <div><h5 id="band-server">server</h5><div class="counts" id="band-counts"></div></div>
      <div><h5>Host</h5><div id="band-host"></div></div>
      <div class="q" id="band-quota-col" hidden><h5><span>Quota</span><span class="age" id="band-quota-age"></span></h5><div id="band-quota"></div></div>
    </section>
    <div class="order"><h3>Sessions</h3>
      <div class="seg" id="fleet-order">
        <button data-order="attention">Needs you first</button>
        <button data-order="tabs">Tab order</button>
      </div>
    </div>
    <section class="cards" id="cards" tabindex="-1"></section>
    <section class="archive">
      <div class="archive-head"><h3>Archive</h3><input id="arch-q" placeholder="Filter by title, handle or directory" spellcheck="false"></div>
      <div id="arch-list"></div>
    </section>
  </main>

  <main class="view v-spawn">
    <form class="spawn" id="spawn">
      <div class="mark">aegis</div>
      <input class="cwd" id="sp-cwd" spellcheck="false" aria-label="Working directory" title="Working directory: click to change">
      <div class="box">
        <textarea id="sp-text" rows="3" aria-label="First message"
          placeholder="What should the agent do? Enter starts the session and sends this; Shift+Enter adds a line."></textarea>
        <div class="picks">
          <select class="pick agent" id="sp-agent" aria-label="Agent"></select>
          <select class="pick" id="sp-harness" aria-label="Harness"></select>
          <input class="pick" id="sp-model" list="sp-models" spellcheck="false" aria-label="Model">
          <datalist id="sp-models"></datalist>
          <select class="pick" id="sp-effort" aria-label="Effort">
            <option value="low">effort low</option><option value="medium">effort medium</option>
            <option value="high">effort high</option><option value="xhigh">effort xhigh</option><option value="max">effort max</option></select>
          <select class="pick" id="sp-permission" aria-label="Permission">
            <option value="read">perm read</option><option value="write">perm write</option>
            <option value="auto">perm auto</option><option value="full">perm full</option></select>
          <button type="button" class="reset" id="sp-reset" hidden>reset</button>
          <button class="send" type="submit" id="sp-go" title="Start the session">↵</button>
        </div>
      </div>
      <p class="err-text" id="sp-error"></p>
    </form>
  </main>

  <main class="view v-session">
    <section class="col">
      <div class="tr" id="tr" tabindex="-1"><div id="entries"></div><div class="row working" id="working" hidden><span class="t"></span><span class="g">✻</span><div class="body">Working <span class="meta" id="working-meta"></span></div></div></div>
      <div class="nav" id="nav" hidden>
        <button class="up" id="nav-up" title="Previous agent message (Alt+↑)"></button>
        <button class="pos" id="nav-pos" title="First unread (Alt+U)"></button>
        <button class="down" id="nav-down" title="Next agent message (Alt+↓)"></button>
        <button class="latest" id="jump" title="Latest (G)"></button>
      </div>
      <div class="composer" id="composer">
        <div class="cmd-menu" id="cmd-menu" hidden><input id="cmd-filter" hidden spellcheck="false" placeholder="/command"><div id="cmd-rows"></div></div>
        <div class="replies" id="replies" hidden></div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="Message the agent. Enter sends, Shift+Enter adds a line, / for commands, Esc interrupts."></textarea>
          <div class="acts"><button class="int" id="interrupt" title="Interrupt (Esc)" aria-label="Interrupt" hidden>■</button><button class="send" id="send" title="Send (Enter)" aria-label="Send">↵</button></div>
        </div>
        <div class="chips">
          <span class="chip" id="chip-model"></span><span class="chip" id="chip-effort"></span><span class="chip" id="chip-perm"></span>
          <span class="err-text" id="send-error"></span>
        </div>
      </div>
    </section>
    <aside class="side">
      <div class="sec"><h4>Session</h4>
        <div class="title editable" id="s-title" title="Click to rename"></div>
        <div class="kv"><span class="handle editable" id="s-handle" title="Click to rename"></span><span class="st" id="s-status"></span></div>
        <div class="kv"><span id="s-model"></span></div>
        <div class="kv dim"><span class="path" id="s-cwd"></span></div>
        <div class="askbox" id="s-ask" hidden></div>
      </div>
      <div class="sec" id="s-plan-sec" hidden><h4>Plan</h4><div class="plan" id="s-plan"></div></div>
      <div class="sec" id="s-mon-sec" hidden><h4>Monitors</h4><div id="s-monitors"></div></div>
      <div class="sec"><h4>Context</h4>
        <div class="bar"><i id="s-bar" style="width:0%"></i></div>
        <div class="kv"><span id="s-tokens">no turn yet</span><span id="s-pct"></span></div>
        <div class="kv"><span>Cost</span><span id="s-cost">$0.00</span></div>
      </div>
      <div class="sec" id="s-quota-sec" hidden><h4>Quota</h4><div id="s-quota"></div></div>
      <div class="sec acts live-only"><button class="btn" id="stop-session" title="End the process; the next message resumes it">Stop</button><button class="btn" id="restart" title="Send “Continue”">Restart</button><button class="btn" id="close" title="Archive it: the tab goes away in every browser">Close</button></div>
      <div class="sec read-only"><p class="sub">Archived. Reopen it to continue the conversation.</p><button class="btn primary" id="reopen">Reopen</button></div>
      <div class="sec ver" id="ver-sec" hidden><h4 id="ver-head">aegis</h4>
        <div class="kv"><span>running</span><span id="ver-run"></span></div>
        <div class="kv dim" id="ver-ref-row" hidden><span>ref</span><span class="path" id="ver-ref"></span></div>
        <div class="kv dim" id="ver-base-row" hidden><span>base</span><span class="v" id="ver-base"></span></div>
        <div class="kv"><span>latest</span><span id="ver-latest"></span></div>
      </div>
      <p class="sub err-text" id="side-error"></p>
    </aside>
  </main>
  <div class="keymap" id="keymap" hidden></div>
</div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
