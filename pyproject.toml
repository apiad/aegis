[project]
name = "aegis-harness"
version = "2.21.0"
description = "A web-native workplace for coding agents: Claude Code sessions in browser tabs, with monitors, queues and handoffs over MCP."
readme = "README.md"
authors = [
    { name = "Alejandro Piad", email = "apiad@apiad.net" }
]
license = { text = "MIT" }
keywords = ["ai", "agents", "claude", "harness", "mcp", "web"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.28",
    "pydantic>=2.12.5",
    "wayfind>=0.1.1",
    "ruamel.yaml>=0.18",
    "starlette>=0.46",
    "typer>=0.24.1",
    "uvicorn>=0.32",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Browsers the agent and the person share (browsers.py); also run
# `playwright install chromium` once.
browser = ["playwright>=1.63.0"]
# Search fused with a text-embedding model (knowledge/embed.py), when
# knowledge.embeddings names one in .aegis.yaml; about 1 GB resident.
embeddings = ["fastembed>=0.4"]

[project.urls]
Homepage      = "https://aegis.syalia.com"
Repository    = "https://github.com/syalia-srl/aegis"
Issues        = "https://github.com/syalia-srl/aegis/issues"
Changelog     = "https://github.com/syalia-srl/aegis/blob/main/CHANGELOG.md"

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

# The release notes ship with the code they describe: /whats-new reads them
# from the installed package (src/aegis/changelog_read.py).
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "aegis/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/aegis",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: drives real agent CLIs, models or remote hosts; skipped unless `--run-live` (`make test-live`)",
    "canary: drives the published harnesses against a fake model; skipped unless `--run-canary` (`make canary`)",
    "browser: drives headless Chromium through Playwright; needs `playwright install chromium`",
    "multiuser: runs aegis as a service user with capabilities and real Linux users; skipped unless `--run-multiuser` (`make test-multiuser`)",
    "quarantine(issue): a known flaky test, out of the PR gate, `make test` and the release run until its issue is fixed; nightly.yml and `make test-quarantine` run it (#776)",
    "slow: 1.5s or more serially, setup and teardown included; `make test` deselects it, `make test-slow` and `make test-all` run it",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "playwright>=1.63.0",
    "httpx>=0.28",
    "psutil>=6.0",
    "pytest-httpx>=0.35",
    "pytest-split>=0.11.0",
]
