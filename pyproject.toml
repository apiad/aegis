[project]
name = "aegis-harness"
version = "2.0.0"
description = "A web-native workplace for coding agents: Claude Code sessions in browser tabs, with monitors, queues and handoffs over MCP."
readme = "README.md"
authors = [
    { name = "Alejandro Piad", email = "apiad@apiad.net" }
]
license = { text = "MIT" }
keywords = ["ai", "agents", "claude", "harness", "mcp", "web"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.0",
    "pydantic>=2.12.5",
    "ruamel.yaml>=0.18",
    "starlette>=0.46",
    "typer>=0.24.1",
    "uvicorn>=0.32",
    "websockets>=13.0",
]

[project.urls]
Repository    = "https://github.com/apiad/aegis"
Issues        = "https://github.com/apiad/aegis/issues"
Changelog     = "https://github.com/apiad/aegis/blob/main/CHANGELOG.md"

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aegis",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: drives real agent CLIs, models or remote hosts; skipped unless `--run-live` (`make test-live`)",
    "browser: drives headless Chromium through Playwright; needs `playwright install chromium`",
    "slow: 1.5s or more serially, setup and teardown included; `make test` deselects it, `make test-all` runs it",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "playwright>=1.63.0",
    "httpx>=0.28",
    "psutil>=6.0",
]
