# Lint rules for aegis. Run with `make lint-docs` (or `rift check`).
#
# Everything here is mechanical: rift extracts strings from the code and docs and
# asks whether they hold. It never reads prose for meaning. The roster rules of the
# legacy tree (slash commands, drivers, config sections, the mkdocs nav) went with
# it to legacy/ in 2.0; add a rule here the first time a roster in this tree can
# drift from its doc.
#
# Scope: rift is a private repo and not on PyPI, so CI cannot install it. These
# rules run from the Makefile on a dev machine only.

rules:

  # A doc that names a file nobody wrote, or that was moved. Anchored on real
  # top-level directories; to discuss a file that is gone, name it in plain prose
  # rather than in backticks.
  - name: "every file path named in the docs exists"
    extract:
      file:
        - "AGENTS.md"
        - "DESIGN.md"
        - "README.md"
        - "know-how/*.md"
      regex: '`((?:src|docs|tests|know-how|scripts|legacy)/[A-Za-z0-9_./-]+\.(?:md|py|yaml|yml|js|css|json|toml|jsonl|txt|sh))(?::[A-Za-z0-9_,-]+)?`'
    require:
      exists: true

  - name: "every know-how doc carries a single-line when: in its frontmatter"
    severity: warning
    contain:
      in: "know-how/*.md"
      zone: { before: '^# ' }
      matches: '\A---\n(?:.*\n)*?when: \S.*\n(?:.*\n)*?---\n'

  # forbid masks inline code, so it cannot see a backticked filename. This extracts
  # from the raw file and requires each name in a file that never exists, so any
  # know-how filename in AGENTS.md is reported.
  - name: "AGENTS.md names no individual know-how doc"
    extract:
      file: "AGENTS.md"
      regex: '(know-how/[A-Za-z0-9_-]+\.md)'
    require:
      in: "this-file-never-exists.md"

  # Status is derivable from git and CHANGELOG.md, and goes false one commit later.
  - name: "AGENTS.md and DESIGN.md carry no status log"
    extract:
      list: ['Task \d+ done', '\d+ tests\b', 'shipped \(20\d\d-', 'as of 20\d\d-', 'current status', 'not yet implemented']
    forbid:
      in: ["AGENTS.md", "DESIGN.md"]
      as: regex
      case_insensitive: true
